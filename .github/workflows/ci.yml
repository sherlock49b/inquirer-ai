name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Use a short temp dir so Unix-socket paths stay under the macOS AF_UNIX
# sun_path limit (104 bytes). The default macOS runner $TMPDIR
# (/private/var/folders/.../T/) plus a test-named subdir overflows it; /tmp
# keeps t.TempDir()/tmp_path-derived socket paths short. No-op on Linux.
env:
  TMPDIR: /tmp

jobs:
  python:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # One macOS job to catch OS-specific behavior (e.g. Unix-socket
        # signal-cleanup) that ubuntu-only CI cannot.
        include:
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run pyright src/

      - name: Run tests
        run: uv run pytest -v --cov=inquirer_ai --cov-report=term-missing

  go:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    strategy:
      matrix:
        os: [ubuntu-latest]
        go-version: ["1.22", "1.23"]
        include:
          - os: macos-latest
            go-version: "1.23"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Format check
        run: test -z "$(gofmt -l ./prompt/ ./examples/)"

      - name: Vet
        run: go vet ./prompt/ ./examples/...

      - name: Run tests
        # -race: the agent/socket transport spawns goroutines; the detector guards
        # the concurrent paths. Runs in CI (authoritative) not pre-commit, which
        # stays fast — see the precommit-contention note. TMPDIR=/tmp (job env)
        # keeps Unix-socket paths under the macOS sun_path limit.
        run: go test ./prompt/ -race -v -cover -count=1

      - name: Build example
        run: go build ./examples/demo/

  typescript:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: typescript
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: ["18", "20", "22"]
        include:
          - os: macos-latest
            node-version: "22"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx tsc

      - name: Lint
        run: npx biome check src/ tests/

      - name: Run tests
        # The library supports Node >=18 (package.json engines), but the test
        # runner vitest >=4 requires Node >=20 (it imports node:util styleText).
        # Node 18 still runs install + typecheck + build + lint above, proving the
        # shipped code compiles for Node 18 consumers; the suite runs on 20/22.
        if: matrix.node-version != '18'
        run: npx vitest run

  rust:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust-version: ["stable", "1.85"]
        include:
          - os: macos-latest
            rust-version: "stable"

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-version }}
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --locked
